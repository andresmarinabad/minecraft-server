services:
  minecraft:
    image: itzg/minecraft-server:2026.9.0
    restart: unless-stopped

    ports:
      - "25565:25565"

    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "1.21.4"
      MEMORY: "2G"
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"

    volumes:
      - ./data:/data

  minecraft-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped

    ports:
      - "8080:8080"

    depends_on:
      - minecraft
